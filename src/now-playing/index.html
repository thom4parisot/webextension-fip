<!DOCTYPE html>
<html ng-csp>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{'extension_name' | i18n}}</title>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body ng-controller="BroadcastController" aria-live>

<header ng-controller="RadioController" ng-cloak>
  <svg class="icon volume-range" aria-hidden="true"><use ng-attr-href="../resources/icons.svg#{{volumeIcon()}}"/></svg>
  <input type="range" id="volume-range" step="0.1" min="0" max="1" list="tickmarks" ng-model="volume" tabindex="0">
  <datalist id="tickmarks">
    <option value="0">
    <option value="0.25">
    <option value="0.5">
    <option value="0.75">
    <option value="1">
  </datalist>
  <button type="button" id="playback-button" ng-click="toggle()" ng-class="status" tabindex="0">
    <svg class="icon" aria-hidden="true"><use ng-attr-href="../resources/icons.svg#{{playbackIcon()}}"/></svg>
  </button>
  <p class="network-status" role="status" ng-show="status === 'OFFLINE'">{{'offline' | i18n}}</p>
</header>

<main ng-cloak>
  <div class="tiles" data-current-index="{{current_index}}" style="--current-index:{{current_index}};">
    <section ng-repeat="(index,broadcast) in broadcasts" class="status-{{broadcast | status}}" ng-class="{show: current_index === index}" data-start="{{broadcast.start_time | date:'yyyy-MM-dd HH:mm:ss Z'}}" data-end="{{broadcast.end_time | date:'yyyy-MM-dd HH:mm:ss Z'}}">
      <aside class="panel" id="cover">
        <img ng-src="{{broadcast.cover || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='}}" class="album-cover" alt="{{broadcast.title}} from {{broadcast.artist}}" loading="lazy" >

        <time class="status" data-status="{{broadcast | status}}" datetime="{{broadcast.start_time | date:'yyyy-MM-dd HH:mm:ss Z'}}" ng-bind="(broadcast | status) !== 'current' ? (broadcast.start_time | ago) : ('status_' + (broadcast | status) | i18n)"></time>
      </aside>

      <article class="panel" id="content">
        <h2 class="title" ng-show="broadcast.title && broadcast.authors">
          <a ng-href="https://www.last.fm/search/tracks?q={{[(broadcast | artist), broadcast.album, broadcast.title] | searchQuery}}" target="_blank">{{broadcast.title}}</a>
          <button type="button" class="love" ng-if="canLove" ng-click="toggleLove(broadcast)" aria-pressed="{{isLoved(broadcast)}}" title="{{(isLoved(broadcast) ? 'unlove_track' : 'love_track') | i18n}}" aria-label="{{(isLoved(broadcast) ? 'unlove_track' : 'love_track') | i18n}}"></button>
        </h2>

        <h2 class="title" ng-show="!broadcast.authors">{{broadcast.title || ('no_information' | i18n)}}</h2>

        <ul class="metadata">
          <li class="album-title" ng-show="broadcast.album">
            <svg class="icon" aria-hidden="true"><use href="../resources/icons.svg#disc-3"/></svg>
            <a ng-href="https://www.last.fm/search/albums?q={{[(broadcast | artist), broadcast.album] | searchQuery}}" target="_blank">{{broadcast.album}}</a>
          </li>
          <li class="artist" ng-show="broadcast.interpreters">
            <svg class="icon" aria-hidden="true"><use href="../resources/icons.svg#user"/></svg>
            <ul>
              <li ng-repeat="performer in broadcast.interpreters"><a ng-href="https://www.last.fm/search/artists?q={{performer | uriComponent}}" target="_blank">{{performer}}</a></li>
            </ul>
          </li>
          <li class="album-date" ng-show="broadcast.album && broadcast.year">
            <svg class="icon" aria-hidden="true"><use href="../resources/icons.svg#calendar"/></svg>
            <date>{{broadcast.year}}</date>
          </li>
          <li class="external-links" ng-show="broadcast.external_links.itunes || broadcast.external_links.spotify || broadcast.external_links.youtube">
            <ul class="inline-list">
              <li ng-show="broadcast.external_links.itunes"><svg class="icon" aria-hidden="true"><use href="../resources/icons.svg#applemusic"/></svg><a ng-href="{{broadcast.external_links.itunes.link}}" target="_blank">Apple Music</a></li>
              <li ng-show="broadcast.external_links.spotify"><svg class="icon" aria-hidden="true"><use href="../resources/icons.svg#spotify"/></svg><a ng-href="{{broadcast.external_links.spotify.link}}" target="_blank">Spotify</a></li>
              <li ng-show="broadcast.external_links.youtube"><svg class="icon" aria-hidden="true"><use href="../resources/icons.svg#youtube"/></svg><a ng-href="{{broadcast.external_links.youtube.link}}" target="_blank">YouTube</a></li>
            </ul>
          </li>
        </ul>
      </article>
    </section>
  </div>

  <nav ng-show="broadcasts.length > 1">
    <ul>
      <li>
        <button ng-click="previous()" ng-disabled="current_index === 0">
          <svg class="icon" aria-hidden="true"><use href="../resources/icons.svg#circle-arrow-left"/></svg>
          <span class="label">Previous</span>
        </button>
      </li>
      <li>
        <button ng-click="next()" ng-disabled="current_index === broadcasts.length-1">
          <span class="label">Next</span>
          <svg class="icon" aria-hidden="true"><use href="../resources/icons.svg#circle-arrow-right"/></svg>
        </button>
      </li>
    </ul>
  </nav>
</main>

<footer ng-cloak>
  <nav>
    <ul>
      <li class="main">
        <select name="stations" ng-model="currentStation" ng-change="saveStation()" required>
          <option ng-repeat="(id, station) in stations | startsWith:'fip-'" value="{{id}}">{{ station.name }}</option>
          <optgroup label="{{'webradios' | i18n}}">
            <option ng-repeat="(id, station) in stations | startsWith:'theme-'" value="{{id}}">{{ station.name }}</option>
          </optgroup>
        </select>
      </li>
      <li>
        <svg class="icon" role="img" aria-label="Last.fm Status" ng-class="{'icon-activated': lastfm_enabled, 'icon-deactivated': !lastfm_enabled}"><use href="../resources/icons.svg#lastdotfm"/></svg>
        <a href="#settings">{{ 'change_settings' | i18n }}</a>
      </li>
    </ul>
  </nav>
</footer>

<script src="./app.js" type="module"></script>
</body>
</html>
