name: Release

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - run: npm clean-install-test

    # checks the extension still builds, without the Last.fm secrets
    - run: npm run package

  # the Last.fm secrets are only available to tags, in the Webstores environment
  package:
    needs: test
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    environment: Webstores
    permissions:
      contents: write
      # build provenance attestations
      id-token: write
      attestations: write
    env:
      LAST_FM_SECRET: ${{ secrets.LAST_FM_SECRET }}
      LAST_FM_KEY: ${{ secrets.LAST_FM_KEY }}
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - run: npm clean-install

    - name: Package the extension
      run: |
        mkdir -p dist
        npm run package

    # verify with `gh attestation verify <zip> --repo thom4parisot/webextension-fip`
    - name: Attest the packages provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: dist/*.zip

    # the `## Version X.Y.Z` section of the French changelog, required to release
    - name: Extract the release notes
      run: |
        awk -v heading="## Version ${VERSION#v}" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.fr.md > "$RUNNER_TEMP/notes.md"
        grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::No '## Version ${VERSION#v}' section in CHANGELOG.fr.md"; exit 1; }
      env:
        VERSION: ${{ github.ref_name }}

    # Chrome, Firefox and Firefox for Android package, plus the source code for AMO reviewers
    # the changelog section comes first, then the notes generated from the merged pull requests
    - name: Create release
      run: gh release create "$VERSION" dist/*.zip --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ github.ref_name }}
